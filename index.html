<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="るべりえゲーム" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>るべりえ ゲーム置き場</title>
    <style>
      :root {
        --cream: #fdf6e7;
        --paper: #fffdf7;
        --ink: #3d2b23;
        --ink-soft: #7a6558;
        --red: #b3372a;
        --red-dark: #93301f;
        --line: #ecd9bd;
        --gray-bg: #efedea;
        --gray-ink: #8b857e;
        --gray-line: #ddd8d1;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--cream);
        color: var(--ink);
        font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Noto Sans JP", sans-serif;
        line-height: 1.6;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 36px 20px 28px;
      }

      /* ---------- ヘッダー ---------- */
      header { text-align: center; margin-bottom: 30px; }
      header h1 {
        margin: 0 0 8px;
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: var(--red-dark);
      }
      header h1 .accent { color: var(--red); }
      header p {
        margin: 0;
        font-size: 0.95rem;
        color: var(--ink-soft);
      }
      .rule {
        width: 56px;
        height: 4px;
        margin: 16px auto 0;
        border-radius: 2px;
        background: var(--red);
        opacity: 0.85;
      }

      /* ---------- ゲームカード（繰り返し構造） ---------- */
      .games {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .card {
        display: block;
        background: var(--paper);
        border: 1.5px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        text-decoration: none;
        color: inherit;
        box-shadow: 0 3px 10px rgba(147, 48, 31, 0.08);
      }
      a.card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
      a.card:active {
        transform: scale(0.985);
        box-shadow: 0 1px 4px rgba(147, 48, 31, 0.12);
      }
      .card .thumb {
        display: block;
        width: 100%;
        height: auto;
        background: #f3e7d3;
      }
      .card .body { padding: 18px 20px 20px; }
      .card h2 {
        margin: 0 0 6px;
        font-size: 1.2rem;
        font-weight: 800;
        line-height: 1.4;
      }
      .card .desc {
        margin: 0;
        font-size: 0.92rem;
        color: var(--ink-soft);
      }
      .play {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        margin-top: 16px;
        min-height: 48px;
        padding: 10px 26px;
        border-radius: 999px;
        background: var(--red);
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.06em;
      }

      /* ---------- 準備中カード ---------- */
      .card.soon {
        background: var(--gray-bg);
        border: 1.5px dashed var(--gray-line);
        box-shadow: none;
        text-align: center;
        padding: 34px 20px 30px;
      }
      .card.soon .badge {
        display: inline-block;
        padding: 5px 16px;
        border-radius: 999px;
        border: 1.5px solid var(--gray-line);
        background: #e3e0da;
        color: var(--gray-ink);
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      .card.soon h2 {
        margin-top: 14px;
        color: var(--gray-ink);
        font-size: 1.1rem;
      }
      .card.soon .desc { color: var(--gray-ink); }

      /* ---------- フッター ---------- */
      footer {
        margin-top: 36px;
        text-align: center;
        border-top: 1.5px solid var(--line);
        padding-top: 22px;
      }
      footer a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 10px 18px;
        color: var(--red-dark);
        font-weight: 700;
        font-size: 0.98rem;
        text-decoration: none;
      }
      footer a .arrow { margin-right: 6px; }
    </style>
  </head>
